[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "best-practices-mcp"
version = "0.8.0"
description = "Independent MCP server for interacting with the OpenSSF Best Practices Badge website"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/best_practices_mcp/data/BADGEAPP-LICENSE.txt"]
authors = [{ name = "Reponomics" }]
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "pydantic==2.14.3", "httpx2==2.16.0", "anyio==4.16.0"]

[project.urls]
Repository = "https://github.com/reponomics/best-practices-mcp"
Issues = "https://github.com/reponomics/best-practices-mcp/issues"
Documentation = "https://github.com/reponomics/best-practices-mcp/blob/main/README.md"

[dependency-groups]
dev = [
    "build==1.6.1",
    "coverage==7.17.3",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "packaging==26.3",
    "pip==26.3",
    "pre-commit==4.7.0",
    "PyYAML==6.0.3",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "setuptools==84.2.1",
    "twine==7.0.0",
    "types-jsonschema==4.26.0.20261006",
    "types-PyYAML==6.0.12.20261113",
]

# Atheris publishes Linux x86_64 wheels; keep it out of normal development installs.
fuzz = ["atheris==3.1.0"]

audit-tools = ["uv==0.13.8"]
release-tools = ["cyclonedx-bom==8.0.1"]
verification-tools = ["pypi-attestations==0.0.31"]

[tool.uv]
required-version = "==0.13.8"
default-groups = ["dev"]

[tool.uv.dependency-groups]
fuzz = { requires-python = ">=3.12,<3.15" }

[project.scripts]
bestpractices-mcp = "best_practices_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
best_practices_mcp = ["data/*.json", "data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Development scripts import one another as top-level modules; tests import them the same way.
pythonpath = ["scripts"]
addopts = "-ra"
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source_pkgs = ["best_practices_mcp"]
parallel = true
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 95
show_missing = true
precision = 2

[tool.mypy]
python_version = "3.11"
files = ["src/best_practices_mcp", "scripts", "tests"]
mypy_path = ["src", "scripts"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Installed only in the optional fuzz and release-tools groups, and published without type stubs.
module = ["atheris", "cyclonedx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are exempt from strict mode's annotation requirements. They also pass fakes where
# real collaborators are expected, patch attributes, and read union results from the SDK
# without narrowing, so those four error codes are off here. The other checks apply.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["union-attr", "arg-type", "attr-defined", "method-assign"]
