[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "best-practices-mcp"
version = "0.1.1-beta.1"
description = "Independent MCP server for interacting with the OpenSSF Best Practices Badge website"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/best_practices_mcp/data/BADGEAPP-LICENSE.txt"]
authors = [{ name = "Reponomics" }]
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "pydantic==2.14.3", "httpx2==2.16.0", "anyio==4.16.0"]

[project.urls]
Repository = "https://github.com/reponomics/best-practices-mcp"
Issues = "https://github.com/reponomics/best-practices-mcp/issues"
Documentation = "https://github.com/reponomics/best-practices-mcp/blob/main/README.md"

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "coverage==7.17.2",
    "jsonschema==4.26.0",
    "packaging==26.3",
    "PyYAML==6.0.3",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "setuptools==84.2.1",
    "twine==7.0.0",
    "uv==0.13.7",
]

[project.scripts]
bestpractices-mcp = "best_practices_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
best_practices_mcp = ["data/*.json", "data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source_pkgs = ["best_practices_mcp"]
parallel = true
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
precision = 2
