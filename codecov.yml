# Every compatibility job enforces coverage.py's combined 95% total through Make.
# Codecov reports trends; its percentage statuses remain informational.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, flags"
  require_changes: true

flags:
  server:
    paths: [src/best_practices_mcp/]
    carryforward: false
