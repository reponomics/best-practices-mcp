name: Fuzzing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Document and proposal fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned environment manager
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: pyproject.toml
          require-checksums: true
          # uv 0.13.10: uv-x86_64-unknown-linux-gnu.tar.gz
          checksum: bf65ac1a0af10f92c522d91ac096c7c0a39657647b155577e7836c2cbbb4526c
          enable-cache: false
      - name: Install locked fuzz tooling and Python 3.12
        run: make setup-fuzz
      - name: Fuzz both targets for 30 seconds each
        run: make -k fuzz
      - name: Retain generated corpora and failure inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-inputs
          path: build/fuzz/
          if-no-files-found: warn
          retention-days: 14
