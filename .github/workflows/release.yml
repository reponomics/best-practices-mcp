name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  BUILDER_WORKFLOW: reponomics/release-infrastructure/.github/workflows/attest.yml
  BUILDER_COMMIT: '4f684c645ece1c84caaf2868df5b146670219683'

jobs:
  preflight:
    name: Verify the draft release identity
    if: >-
      github.repository == 'reponomics/best-practices-mcp' &&
      github.event.repository.private == false &&
      vars.PYPI_PUBLISH_ENABLED == 'true' &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # GitHub draft visibility requires push access. This job only queries metadata;
    # it never checks out, installs or executes project code.
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.draft.outputs.prerelease }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Verify draft and tag
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: &verify-draft |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def api(path, *options):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', *options, 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/' + path],
                  text=True, timeout=60,
              ))

          tag = os.environ['RELEASE_TAG']
          if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-beta\.[0-9]+)?', tag) is None:
              raise SystemExit('Invalid release tag')
          # The tag endpoint only returns published releases. List drafts with
          # push access, match the exact tag across all pages, then read by ID.
          pages = api('releases?per_page=100', '--paginate', '--slurp')
          matches = [release for page in pages for release in page if release['tag_name'] == tag]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one release for the candidate tag')
          release_id = str(matches[0]['id'])
          if os.environ.get('RELEASE_ID', release_id) != release_id:
              raise SystemExit('Draft release identity changed during publication')
          release = api('releases/' + release_id)
          ref = api('git/ref/tags/' + tag)['object']
          if ref['type'] != 'commit' or ref['sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Release tag no longer identifies this workflow revision')
          if release['tag_name'] != tag or not release['draft'] or release['immutable']:
              raise SystemExit('An existing mutable draft is required')
          if release['prerelease'] != ('-beta.' in tag):
              raise SystemExit('Draft prerelease flag does not match the tag')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('prerelease=' + str(release['prerelease']).lower() + '\n')
              output.write('release_id=' + release_id + '\n')
          PY

  build:
    name: Validate and build the release candidate
    needs: preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.candidate.outputs.artifact-id }}
      wheel: ${{ steps.subjects.outputs.wheel }}
      sdist: ${{ steps.subjects.outputs.sdist }}
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up minimum supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Set up the pinned environment manager
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Set up the inventoried Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install locked development and isolated SBOM tools
        run: make setup release-evidence-setup
      - name: Validate tag, version, manifest and main ancestry
        env:
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: make release-check
      - name: Run required conformance checks
        run: make validate
      - name: Build and qualify the exact upload candidates with runtime SBOMs
        run: make release-build release-qualify RELEASE_SBOM=1
      - name: Inventory the pinned workflow linter
        run: make actionlint-inventory
      - name: Scan candidate and tooling dependencies for vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=uv.lock
            --lockfile=osv-scanner:build/actionlint-inventory/inventory.json
            --lockfile=osv-scanner:build/actionlint-inventory/stdlib-inventory.json
            --lockfile=osv-scanner:build/release/reports/runtime-wheel.inventory.json
            --lockfile=osv-scanner:build/release/reports/runtime-sdist.inventory.json
            --no-resolve
            --format=sarif
            --output-file=build/release/reports/osv-vulnerabilities.sarif
      - name: Check candidate and tooling licenses
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=uv.lock
            --lockfile=osv-scanner:build/actionlint-inventory/inventory.json
            --lockfile=osv-scanner:build/release/reports/runtime-wheel.inventory.json
            --lockfile=osv-scanner:build/release/reports/runtime-sdist.inventory.json
            --no-resolve
            --licenses=MIT,MIT-0,0BSD,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,PSF-2.0,MPL-2.0,BlueOak-1.0.0,Unlicense
            --all-packages
            --format=json
            --output-file=build/release/reports/osv-licenses.json
      - name: Export the separate development tooling inventory
        if: ${{ !cancelled() }}
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=uv.lock
            --lockfile=osv-scanner:build/actionlint-inventory/inventory.json
            --no-resolve
            --all-packages
            --format=cyclonedx-1-6
            --output-file=build/release/reports/tooling.cdx.json
      - name: Assemble the successful release bundle
        env:
          RELEASE_OSV_VERSION: '2.7.1'
        run: make release-bundle
      - name: Identify the qualified signing subjects
        id: subjects
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path('build/release/bundle')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              for kind, pattern in [('wheel', '*.whl'), ('sdist', '*.tar.gz')]:
                  matches = list((root / 'dist').glob(pattern))
                  if len(matches) != 1:
                      raise SystemExit('Expected one distribution of each kind')
                  output.write(kind + '=' + matches[0].relative_to(root).as_posix() + '\n')
          PY
      - name: Preserve validated candidate and evidence
        id: candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Retain qualification and scan evidence on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/release/evidence.json
            build/release/evidence.log
            build/release/reports/
            build/actionlint-inventory/
          if-no-files-found: warn
          retention-days: 30

  provenance:
    needs: build
    uses: reponomics/release-infrastructure/.github/workflows/attest.yml@4f684c645ece1c84caaf2868df5b146670219683
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      artifact-id: ${{ needs.build.outputs.candidate }}
      subject-path: dist/*
      attestation-name: provenance

  wheel-sbom:
    needs: build
    uses: reponomics/release-infrastructure/.github/workflows/attest.yml@4f684c645ece1c84caaf2868df5b146670219683
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      artifact-id: ${{ needs.build.outputs.candidate }}
      subject-path: ${{ needs.build.outputs.wheel }}
      attestation-name: runtime-wheel
      sbom-path: reports/runtime-wheel.cdx.json

  sdist-sbom:
    needs: build
    uses: reponomics/release-infrastructure/.github/workflows/attest.yml@4f684c645ece1c84caaf2868df5b146670219683
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      artifact-id: ${{ needs.build.outputs.candidate }}
      subject-path: ${{ needs.build.outputs.sdist }}
      attestation-name: runtime-sdist
      sbom-path: reports/runtime-sdist.cdx.json

  publish:
    name: Verify and publish the approved candidate
    needs: [build, provenance, wheel-sbom, sdist-sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/best-practices-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      # Only fixed workflow code executes here. Downloaded files are data, never scripts.
      - name: Download this run's exact candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.candidate }}
          path: bundle
          merge-multiple: true
      - name: Verify candidate identities and checksums
        id: verify
        run: &verify-candidate |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def expected_files(root, manifest):
              entries = manifest['artifacts']
              if not isinstance(entries, dict) or not entries:
                  raise ValueError('Missing artifact inventory')
              for name, record in entries.items():
                  if re.fullmatch(r'(dist|reports)/[A-Za-z0-9_.-]+', name) is None:
                      raise ValueError('Unsafe candidate path')
                  path = root / name
                  if path.is_symlink() or not path.is_file():
                      raise ValueError('Candidate must contain regular files')
                  if record != {'sha256': digest(path), 'bytes': path.stat().st_size}:
                      raise ValueError('Candidate checksum or size mismatch')
              return set(entries) | {'release.json', 'SHA256SUMS'}

          def verify_file_inventory(root, expected):
              paths = list(root.rglob('*'))
              if any(path.is_symlink() for path in paths):
                  raise ValueError('Symlinks are forbidden in the candidate')
              actual = {path.relative_to(root).as_posix() for path in paths if path.is_file()}
              if actual != expected or len({Path(name).name for name in expected}) != len(expected):
                  raise ValueError('Unexpected, missing or colliding candidate files')

          def verify_checksums(root, expected):
              checksums = ''.join(
                  digest(root / name) + '  ' + Path(name).name + '\n'
                  for name in sorted(expected - {'SHA256SUMS'}, key=lambda name: Path(name).name)
              )
              if (root / 'SHA256SUMS').read_text(encoding='utf-8') != checksums:
                  raise ValueError('Checksum manifest mismatch')

          def verify(root):
              manifest = json.loads((root / 'release.json').read_text(encoding='utf-8'))
              if manifest['schema_version'] != 1 or manifest['tag'] != os.environ['RELEASE_TAG']:
                  raise ValueError('Unexpected release identity')
              if manifest['commit'] != os.environ['GITHUB_SHA']:
                  raise ValueError('Candidate belongs to another commit')
              expected = expected_files(root, manifest)
              verify_file_inventory(root, expected)
              verify_checksums(root, expected)
              wheels = list((root / 'dist').glob('*.whl'))
              sdists = list((root / 'dist').glob('*.tar.gz'))
              if len(wheels) != 1 or len(sdists) != 1 or len(list((root / 'dist').iterdir())) != 2:
                  raise ValueError('Expected exactly one wheel and source archive')
              return wheels[0], sdists[0]

          wheel, sdist = verify(Path('bundle'))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('wheel=' + wheel.as_posix() + '\nsdist=' + sdist.as_posix() + '\n')
          PY
      - name: Download this run's signed bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.provenance.outputs.attestations }},${{ needs.wheel-sbom.outputs.attestations }},${{ needs.sdist-sbom.outputs.attestations }}
          path: attestations
          merge-multiple: true
      - name: Verify reviewed builder signatures before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: &verify-signatures |
          for artifact in bundle/dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$BUILDER_WORKFLOW" --signer-digest "$BUILDER_COMMIT" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              --bundle attestations/provenance.sigstore.json --format json > verified-provenance.json
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results = json.loads(Path('verified-provenance.json').read_text())
          expected = {
              'repository': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'],
              'ref': 'refs/tags/' + os.environ['RELEASE_TAG'],
              'path': '.github/workflows/release.yml',
          }
          if not results or any(
              item['verificationResult']['statement']['predicate']['buildDefinition']['externalParameters'] != {'workflow': expected}
              for item in results
          ):
              raise SystemExit('Unexpected source workflow or external build parameters')
          PY
            case "$artifact" in
              *.whl) sbom_bundle=attestations/runtime-wheel.sigstore.json ;;
              *.tar.gz) sbom_bundle=attestations/runtime-sdist.sigstore.json ;;
              *) exit 1 ;;
            esac
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$BUILDER_WORKFLOW" --signer-digest "$BUILDER_COMMIT" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
              --predicate-type https://cyclonedx.org/bom --bundle "$sbom_bundle" --format json > verified-sbom.json
            python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          expected_uri = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/.github/workflows/release.yml@refs/tags/' + os.environ['RELEASE_TAG']
          for name in ('verified-provenance.json', 'verified-sbom.json'):
              results = json.loads(Path(name).read_text())
              if not results:
                  raise SystemExit('No verified attestation')
              for item in results:
                  certificate = item['verificationResult']['signature']['certificate']
                  if certificate['buildConfigURI'] != expected_uri or certificate['buildConfigDigest'] != os.environ['GITHUB_SHA']:
                      raise SystemExit('Unexpected authenticated source workflow')
          PYTHON
          done
      - name: Publish unchanged distributions with PyPI attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: bundle/dist/
          attestations: true
          print-hash: true

  github-release:
    name: Attach evidence and publish the immutable GitHub release
    needs: [preflight, build, provenance, wheel-sbom, sdist-sbom, publish]
    env:
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Recheck the draft and immutable tag identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: *verify-draft
      - name: Download the exact published candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.candidate }}
          path: bundle
          merge-multiple: true
      - name: Verify candidate again before attaching assets
        run: *verify-candidate
      - name: Download this run's signed bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.provenance.outputs.attestations }},${{ needs.wheel-sbom.outputs.attestations }},${{ needs.sdist-sbom.outputs.attestations }}
          path: attestations
          merge-multiple: true
      - name: Verify signatures before release attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: *verify-signatures
      - name: Attach matching assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True, timeout=120)

          def draft(repository, tag):
              release = json.loads(gh('api', 'repos/' + repository + '/releases/' + os.environ['RELEASE_ID']))
              if not release['draft'] or release['immutable'] or release['tag_name'] != tag:
                  raise SystemExit('Release is no longer a mutable draft')
              if release['prerelease'] != ('-beta.' in tag):
                  raise SystemExit('Draft prerelease flag no longer matches the tag')
              ref = json.loads(gh('api', 'repos/' + repository + '/git/ref/tags/' + tag))['object']
              if ref['type'] != 'commit' or ref['sha'] != os.environ['GITHUB_SHA']:
                  raise SystemExit('Release tag no longer identifies this candidate')
              return release

          def asset_inventory(release):
              assets = {asset['name']: asset.get('digest') for asset in release['assets']}
              if len(assets) != len(release['assets']):
                  raise SystemExit('Duplicate release asset names')
              return assets

          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          files = [path for path in Path('bundle').rglob('*') if path.is_file()]
          signatures = list(Path('attestations').iterdir())
          expected_signatures = {'provenance.sigstore.json', 'runtime-wheel.sigstore.json', 'runtime-sdist.sigstore.json'}
          if {path.name for path in signatures} != expected_signatures or any(path.is_symlink() or not path.is_file() for path in signatures):
              raise SystemExit('Unexpected attestation files')
          files.extend(signatures)
          expected = {path.name: 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest() for path in files}
          release = draft(repository, tag)
          existing = asset_inventory(release)
          for name, digest in existing.items():
              if expected.get(name) != digest:
                  raise SystemExit('An existing draft asset differs; investigate before retrying')
          missing = [str(path) for path in files if path.name not in existing]
          if missing:
              gh('release', 'upload', tag, '--repo', repository, *missing)
          if asset_inventory(draft(repository, tag)) != expected:
              raise SystemExit('Uploaded release assets do not exactly match the candidate')
          gh('release', 'edit', tag, '--repo', repository, '--draft=false')
          PY
