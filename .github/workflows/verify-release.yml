name: Verify published release

on:
  # Publication uses GITHUB_TOKEN, so do not rely on its release event.
  workflow_run:
    workflows: [Publish to PyPI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable release tag with signed release manifests to verify
        required: true
        type: string
      commit:
        description: Expected full source commit SHA from the release/tag history
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Follow the release verification guide
    if: >-
      github.repository == 'reponomics/best-practices-mcp' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.path == '.github/workflows/release.yml' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.commit }}
      REPOSITORY: reponomics/best-practices-mcp
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select the release used in the guide's commands
        run: |
          mkdir -p "$RUNNER_TEMP/release-verification"
          exec > >(tee "$RUNNER_TEMP/release-verification/setup.log") 2>&1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'Release: %s\nExpected commit: %s\n' "$RELEASE_TAG" "$EXPECTED_SHA"
          version="${RELEASE_TAG#v}"
          version="${version/-beta./b}"
          {
            echo "WHEEL=best_practices_mcp-$version-py3-none-any.whl"
            echo "SDIST=best_practices_mcp-$version.tar.gz"
            echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/release-verification-tools"
          } >> "$GITHUB_ENV"
          gh --version
      - name: Check out only the locked verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run uses the default branch SHA, never the release's code.
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pyproject.toml
            /uv.lock
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Install the locked PyPI attestation verifier
        run: |
          uv sync --locked --only-group verification-tools --no-install-project --python 3.11 \
            2>&1 | tee -a "$RUNNER_TEMP/release-verification/setup.log"
      # Keep these commands aligned with docs/release/verification.md, sections 1–4.
      # Human inspection of publisher metadata and scan reports remains manual.
      - name: 1. Download and authenticate release assets
        run: |
          exec > >(tee "$RUNNER_TEMP/release-verification/1-assets.log") 2>&1
          gh release verify "$RELEASE_TAG" --repo "$REPOSITORY"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir "$RUNNER_TEMP/release-verification/assets"
          cd "$RUNNER_TEMP/release-verification/assets"
          for asset in *; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$REPOSITORY"
            sleep 0.6
          done
      - name: 1b. Verify the signed release manifests
        run: |
          exec > >(tee "$RUNNER_TEMP/release-verification/1b-manifests.log") 2>&1
          cd "$RUNNER_TEMP/release-verification/assets"
          for manifest in release.json SHA256SUMS; do
            gh attestation verify "$manifest" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$EXPECTED_SHA" --deny-self-hosted-runners \
              --bundle provenance.sigstore.json
          done
          sha256sum -c SHA256SUMS
      - name: 2. Verify the distributions' workflow provenance
        run: |
          exec > >(tee "$RUNNER_TEMP/release-verification/2-provenance.log") 2>&1
          cd "$RUNNER_TEMP/release-verification/assets"
          for distribution in "$WHEEL" "$SDIST"; do
            gh attestation verify "$distribution" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$EXPECTED_SHA" --deny-self-hosted-runners
            gh attestation verify "$distribution" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$EXPECTED_SHA" --deny-self-hosted-runners \
              --bundle provenance.sigstore.json
          done
      - name: 3. Verify PyPI's publisher attestations
        run: |
          exec > >(tee "$RUNNER_TEMP/release-verification/3-pypi.log") 2>&1
          cd "$RUNNER_TEMP/release-verification/assets"
          for distribution in "$WHEEL" "$SDIST"; do
            "$UV_PROJECT_ENVIRONMENT/bin/pypi-attestations" verify pypi \
              --repository "https://github.com/$REPOSITORY" "$distribution"
          done
      - name: 4. Verify the runtime SBOM signatures
        run: |
          exec > >(tee "$RUNNER_TEMP/release-verification/4-sboms.log") 2>&1
          cd "$RUNNER_TEMP/release-verification/assets"
          gh attestation verify "$WHEEL" --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$EXPECTED_SHA" --deny-self-hosted-runners \
            --predicate-type https://cyclonedx.org/bom --bundle runtime-wheel.sigstore.json
          gh attestation verify "$SDIST" --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$EXPECTED_SHA" --deny-self-hosted-runners \
            --predicate-type https://cyclonedx.org/bom --bundle runtime-sdist.sigstore.json
      - name: Retain command output for troubleshooting
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verification/*.log
          if-no-files-found: warn
          retention-days: 30
