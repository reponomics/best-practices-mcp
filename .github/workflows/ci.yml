name: Compatibility and coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.11', '3.12']
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-2025' && 'pwsh' || 'bash' }}
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      BOOTSTRAP_PYTHON: ${{ matrix.python }}
      VENV: build/dev venv
      CI_MATRIX_OS: ${{ matrix.os }}
      CI_MATRIX_PYTHON: ${{ matrix.python }}
    steps:
      - name: Preserve byte-exact upstream fixtures
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up the pinned environment manager
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false
      - name: Install native GNU Make on Windows
        if: runner.os == 'Windows'
        run: |
          choco install make --version=4.4.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ChocolateyInstall/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify task help before environment setup
        run: make help
      - name: Install the locked development environment
        run: make setup
      - name: Formatting, lint, lock and catalog reproduction
        run: make quality catalog-check lock-check
      - name: Offline regression with line and branch coverage
        run: make test-coverage
      - name: Offline installed wheel check
        run: make test-package
      - name: Fresh wheel and sdist installation outside checkout
        if: ${{ !cancelled() }}
        run: make check-fresh-package
      - name: Record exact execution environment
        if: ${{ always() }}
        run: make ci-environment PYTHON=python
      - name: Retain test, coverage and package evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            build/coverage/
            build/verification/fresh-package.json
            build/verification/fresh-package.log
            build/verification/environment.json
          if-no-files-found: warn
          retention-days: 30

  coverage-upload:
    name: Publish measured coverage
    needs: compatibility
    if: >-
      github.repository == 'reponomics/best-practices-mcp' &&
      (github.event_name != 'pull_request' || !github.event.repository.private ||
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/coverage.yml
